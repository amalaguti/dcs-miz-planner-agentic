description: >
  Cold start at Needs Oar Point with 2x250 lb bombs and a 45 gal slipper tank.
  Cross south to a strike area inland of Maupertus on the Cotentin; jettison the
  tank before the attack. Soft enemy trucks plus a light Flak 18 battery on land
  on the opposing (red) side.
