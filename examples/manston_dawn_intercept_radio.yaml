schema_version: "1"
mission_type: intercept
theatre: TheChannel
name: Manston Dawn Intercept (Radio Difficulty)
description: >
  Cold start at Manston at dawn. Use F10 Other radio to pick Easy / Medium / Hard
  opposition; each choice activates one late Bf-109 flight on the Dover approaches.
  Choose one difficulty in play (selecting multiple activates multiple groups).
date:
  year: 1944
  month: 6
  day: 6
start_time: "06:00"
weather: sunny_clear
player:
  aircraft: SpitfireLFMkIX
  airfield: Manston
  coalition: blue
  country: UK
  skill: Player
  start: cold_parking
enemies:
  - aircraft: Bf-109K-4
    count: 1
    skill: Good
    country: ThirdReich
    coalition: red
    late_activation: true
  - aircraft: Bf-109K-4
    count: 2
    skill: Average
    country: ThirdReich
    coalition: red
    late_activation: true
  - aircraft: Bf-109K-4
    count: 4
    skill: Average
    country: ThirdReich
    coalition: red
    late_activation: true
objectives:
  - type: intercept_enemy
zones: []
triggers:
  - name: radio_menu
    once: true
    when:
      - type: time_more
        seconds: 1
    then:
      - type: radio_item_add
        label: "Difficulty: Easy (1× 109)"
        flag: diff_easy
        coalition: blue
      - type: radio_item_add
        label: "Difficulty: Medium (2× 109)"
        flag: diff_medium
        coalition: blue
      - type: radio_item_add
        label: "Difficulty: Hard (4× 109)"
        flag: diff_hard
        coalition: blue
  - name: activate_easy
    once: true
    when:
      - type: flag_is
        flag: diff_easy
        value: true
    then:
      - type: activate_group
        enemy_index: 0
      - type: message
        text: "Easy opposition airborne — one Bf-109. Weapons free."
        duration_s: 12
  - name: activate_medium
    once: true
    when:
      - type: flag_is
        flag: diff_medium
        value: true
    then:
      - type: activate_group
        enemy_index: 1
      - type: message
        text: "Medium opposition airborne — two Bf-109s. Weapons free."
        duration_s: 12
  - name: activate_hard
    once: true
    when:
      - type: flag_is
        flag: diff_hard
        value: true
    then:
      - type: activate_group
        enemy_index: 2
      - type: message
        text: "Hard opposition airborne — four Bf-109s. Weapons free."
        duration_s: 12
