# Compileable sample: player altitude + speed gates with timed re-warn
# (open in ME; expect UNIT ALTITUDE / SPEED + flag / TIME SINCE FLAG rules).
# After T+30s: first warn when out of limits, then re-warn ~every 45s if still
# violating; clear cooldown when back inside limits (no tick-spam).
schema_version: "1"
mission_type: free_flight
theatre: TheChannel
name: Manston Free Flight (altitude/speed gates sample)
description: >
  Same Manston cold free flight as the acceptance example, plus ingress-discipline
  gates: stay below 300 m AGL and under 450 km/h after T+30s. Warnings use a flag
  cooldown so a missed callout can repeat while you stay out of limits, without
  flooding every ME tick.
date:
  year: 1944
  month: 6
  day: 6
start_time: "09:00"
weather: sunny_clear
player:
  aircraft: SpitfireLFMkIX
  airfield: Manston
  coalition: blue
  country: UK
  skill: Player
  start: cold_parking
zones: []
triggers:
  - name: altitude_warn
    once: false
    when:
      - type: time_more
        seconds: 30
      - type: unit_altitude_higher
        altitude_m: 300
        agl: true
      - type: flag_is
        flag: alt_gate_cd
        value: false
    then:
      - type: message
        text: "Manston — too high. Stay below 300 m AGL."
        duration_s: 8
      - type: set_flag
        flag: alt_gate_cd
        value: true
  - name: altitude_rewarn
    once: false
    when:
      - type: time_more
        seconds: 30
      - type: unit_altitude_higher
        altitude_m: 300
        agl: true
      - type: time_since_flag
        flag: alt_gate_cd
        seconds: 45
    then:
      - type: message
        text: "Manston — still too high. Stay below 300 m AGL."
        duration_s: 8
      - type: set_flag
        flag: alt_gate_cd
        value: true
  - name: altitude_clear
    once: false
    when:
      - type: unit_altitude_lower
        altitude_m: 300
        agl: true
    then:
      - type: set_flag
        flag: alt_gate_cd
        value: false
  - name: speed_warn
    once: false
    when:
      - type: time_more
        seconds: 30
      - type: unit_speed_higher
        speed_kmh: 450
      - type: flag_is
        flag: spd_gate_cd
        value: false
    then:
      - type: message
        text: "Manston — too fast. Stay under 450 km/h."
        duration_s: 8
      - type: set_flag
        flag: spd_gate_cd
        value: true
  - name: speed_rewarn
    once: false
    when:
      - type: time_more
        seconds: 30
      - type: unit_speed_higher
        speed_kmh: 450
      - type: time_since_flag
        flag: spd_gate_cd
        seconds: 45
    then:
      - type: message
        text: "Manston — still too fast. Stay under 450 km/h."
        duration_s: 8
      - type: set_flag
        flag: spd_gate_cd
        value: true
  - name: speed_clear
    once: false
    when:
      - type: unit_speed_lower
        speed_kmh: 450
    then:
      - type: set_flag
        flag: spd_gate_cd
        value: false
