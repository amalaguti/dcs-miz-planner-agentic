# Compileable sample: player altitude + speed gates (open in ME;
# expect UNIT ALTITUDE HIGHER AGL + UNIT SPEED HIGHER under Set Rules for Triggers).
# After T+30s, continuous rules warn if you climb above 300 m AGL or exceed 450 km/h.
schema_version: "1"
mission_type: free_flight
theatre: TheChannel
name: Manston Free Flight (altitude/speed gates sample)
description: >
  Same Manston cold free flight as the acceptance example, plus continuous
  ingress-discipline gates on the player: stay below 300 m AGL and under 450 km/h
  after T+30s (time gate avoids parking spam).
date:
  year: 1944
  month: 6
  day: 6
start_time: "09:00"
weather: sunny_clear
player:
  aircraft: SpitfireLFMkIX
  airfield: Manston
  coalition: blue
  country: UK
  skill: Player
  start: cold_parking
zones: []
triggers:
  - name: altitude_gate
    once: false
    when:
      - type: time_more
        seconds: 30
      - type: unit_altitude_higher
        altitude_m: 300
        agl: true
    then:
      - type: message
        text: "Manston — too high. Stay below 300 m AGL."
        duration_s: 8
  - name: speed_gate
    once: false
    when:
      - type: time_more
        seconds: 30
      - type: unit_speed_higher
        speed_kmh: 450
    then:
      - type: message
        text: "Manston — too fast. Stay under 450 km/h."
        duration_s: 8
