# Compileable sample: group_life_less on ground targets (open in ME;
# expect GROUP LIFE LESS under Set Rules for Triggers).
schema_version: "1"
mission_type: ground_attack
theatre: TheChannel
name: Manston Ground Attack (group life less sample)
description: >
  Same Manston Channel ground attack as the acceptance example, plus a
  group_life_less rule: when the truck group remaining life drops below 50%,
  show a callout (partial-damage beat — not full target_dead).
date:
  year: 1944
  month: 6
  day: 6
start_time: "09:00"
weather: sunny_clear
player:
  aircraft: SpitfireLFMkIX
  airfield: Manston
  coalition: blue
  country: UK
  skill: Player
  start: cold_parking
  payload: spitfire_2x250_slipper
strike:
  bearing_deg: 125
  distance_km: 76
  altitude_m: 2000
enemies: []
targets:
  - unit: Blitz_36-6700A
    count: 3
    skill: Average
    country: ThirdReich
    coalition: red
objectives:
  - type: attack_ground
zones: []
triggers:
  - name: targets_damaged_enough
    once: true
    when:
      - type: group_life_less
        target_index: 0
        percent: 50
    then:
      - type: message
        text: "Manston — targets damaged enough (life below 50%)."
        duration_s: 12
      - type: set_flag
        flag: targets_softened
        value: true
