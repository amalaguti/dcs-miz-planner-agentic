[project]
name = "dcs-miz-planner"
version = "0.3.0"
description = "Natural-language -> Mission Spec -> deterministic DCS .miz compiler"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "pydcs>=0.15.0",
    "openai>=2.52.0",
    "python-dotenv>=1.0.0",
    "pypdf>=6.14.2",
]

[project.scripts]
dcs-miz = "dcs_miz_planner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dcs_miz_planner"]

# Packaged YAML under data/ must ship with the wheel (hatchling skips non-.py by default).
[tool.hatch.build.targets.wheel.force-include]
"src/dcs_miz_planner/data" = "dcs_miz_planner/data"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Cursor skills/hooks are local tooling; product CI lints src + tests.
extend-exclude = [".cursor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
