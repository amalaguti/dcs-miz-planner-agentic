# Curated Channel planning knobs for agent/CLI discovery.
# support: supported | advisory | future
# - supported: Spec/compiler-backed id
# - advisory: guides an existing Spec field (see meta)
# - future: roadmap only — do not emit as compile-backed
options:
  - family: mission_type
    id: free_flight
    label: Free flight
    description: Solo/player flight with no enemies or objectives.
    support: supported

  - family: mission_type
    id: intercept
    label: Intercept
    description: Player scramble against an enemy flight with intercept objective.
    support: supported

  - family: mission_type
    id: cap
    label: CAP / patrol
    description: Patrol a station with orbit pattern and engagement rules; optional opposition.
    support: supported

  - family: mission_type
    id: ground_attack
    label: Ground attack
    description: >
      Channel strike with enemy ground targets and a named Spitfire bomb payload
      (prefer slipper tank for Channel crossings; jettison before attack).
    support: supported

  - family: mission_type
    id: escort
    label: Escort
    description: >
      Escort a friendly air package along an airfield-relative Channel route with
      engagement rules; optional enemy bounce.
    support: supported

  - family: start_type
    id: cold_parking
    label: Cold parking
    description: Start from parking cold (DCS TakeOffParking).
    support: supported

  - family: player_flight_size
    id: solo
    label: Solo
    description: Single Skill=Player aircraft (omit player.flight).
    support: supported
    meta:
      omit_flight: true

  - family: player_flight_size
    id: pair
    label: Pair (2)
    description: Two-ship player section via player.flight.size 2.
    support: supported
    meta:
      size: 2

  - family: player_flight_size
    id: three_ship
    label: Three-ship
    description: Three-ship player section via player.flight.size 3.
    support: supported
    meta:
      size: 3

  - family: player_flight_size
    id: four_ship
    label: Four-ship
    description: Four-ship player section via player.flight.size 4 (prefer Manston parking).
    support: supported
    meta:
      size: 4

  - family: player_flight_role
    id: lead
    label: Flight lead
    description: Human is Skill=Player on the first unit; AI wingmen fill the rest.
    support: supported
    meta:
      role: lead

  - family: player_flight_role
    id: wingman
    label: Wingman
    description: >
      Human flies a size-1 Player group beside a separate AI lead group (size−1).
      DCS single-player cannot put Player on unit 2 of a mixed group. With join_up
      (default true) the lead flies the route and you Follow after climb.
    support: supported
    meta:
      role: wingman

  - family: player_flight_join_up
    id: join_up
    label: Join up / Follow lead
    description: >
      Wingman only: AI lead flies the section route; player Follows after takeoff.
      Lead role ignores this (same-group mates already stick). Set join_up false to
      disable Follow/shared route.
    support: supported
    meta:
      join_up: true

  - family: player_flight_join_up
    id: independent
    label: Independent (no Follow)
    description: Wingman groups without Follow — player and AI lead fly separately.
    support: supported
    meta:
      join_up: false

  - family: player_flight_order
    id: rejoin
    label: Section rejoin / form up
    description: >
      F10 "Section: Rejoin" — wingman re-Follows AI lead; lead same-group is advisory
      (native formation). Spec: player.flight.orders include rejoin.
    support: supported
    meta:
      order_id: rejoin
      example: examples/manston_cap_flight_orders.yaml

  - family: player_flight_order
    id: engage
    label: Section engage
    description: >
      F10 "Section: Engage" — AI section ROE weapons free.
    support: supported
    meta:
      order_id: engage

  - family: player_flight_order
    id: orbit
    label: Section orbit
    description: >
      F10 "Section: Orbit" — AI section holds a circle orbit.
    support: supported
    meta:
      order_id: orbit

  - family: player_flight_order
    id: rtb
    label: Section RTB
    description: >
      F10 "Section: RTB" — AI section lands at home airfield.
    support: supported
    meta:
      order_id: rtb

  - family: player_flight_order
    id: break
    label: Section break
    description: >
      F10 "Section: Break" — stop AI section tasking / leave formation push.
    support: supported
    meta:
      order_id: break

  - family: player_flight_discipline
    id: defaults
    label: Section discipline (defaults)
    description: >
      Opt-in fail-to-follow for wingman+join_up. Empty discipline:{} uses radius
      2500 m, soft warn at 45 s outside, hard message_end at 120 s. Spec:
      player.flight.discipline: {}. Example: manston_cap_flight_discipline.yaml.
    support: supported
    meta:
      example: examples/manston_cap_flight_discipline.yaml

  - family: player_flight_discipline
    id: message_end
    label: Discipline hard = message only
    description: >
      Soft rejoin warn then a final message (no mission_end). Spec:
      player.flight.discipline.hard: message_end
    support: supported
    meta:
      hard: message_end

  - family: player_flight_discipline
    id: mission_end
    label: Discipline hard = mission end
    description: >
      Soft warn then EndMission if still outside the section bubble. Spec:
      player.flight.discipline.hard: mission_end
    support: supported
    meta:
      hard: mission_end

  - family: player_flight_discipline
    id: section_rtb
    label: Discipline hard = section RTB
    description: >
      Soft warn then push AI lead Land/RTB. Spec:
      player.flight.discipline.hard: section_rtb
    support: supported
    meta:
      hard: section_rtb

  - family: weather
    id: sunny_clear
