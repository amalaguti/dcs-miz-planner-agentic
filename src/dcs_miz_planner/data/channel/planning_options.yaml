  - family: randomization
    id: seeded_reroll
    label: Seeded reroll
    description: >
      Reroll weather, clock, geometry, and/or opposition on an existing Spec via
      dcs-miz randomize / randomize_mission tool (seed argument; not a Spec field).
    support: advisory

  # --- mission_behaviour: compile-backed Spec recipes (agent creativity) ---
  - family: mission_behaviour
    id: altitude_speed_gates
    label: Altitude / speed ingress gates
    description: >
      Player discipline after a short time gate: warn when above an AGL ceiling or
      faster than a speed limit, then re-warn on a cooldown while still violating
      (flag + time_since_flag) — not every ME tick.
    support: supported
    meta:
      intent: [ingress_discipline, low_level, challenge]
      mission_types: [free_flight, intercept, cap, ground_attack, escort]
      conditions:
        [
          time_more,
          unit_altitude_higher,
          unit_altitude_lower,
          unit_speed_higher,
          unit_speed_lower,
          flag_is,
          time_since_flag,
        ]
      actions: [message, set_flag]
      recipe: >
        After time_more (~30s): first warn when unit_altitude_higher / unit_speed_higher
        and cooldown flag is false → message + set_flag true; re-warn when still out of
        limits and time_since_flag (~45s) → message + set_flag true; clear flag with
        unit_altitude_lower / unit_speed_lower. altitude_m/speed_kmh emit as integers.
      example: examples/manston_freeflight_altitude_speed_gates.yaml

  - family: mission_behaviour
    id: mark_smoke
    label: F10 mark + smoke marker
    description: >
      Place an F10 map mark and/or ME smoke marker on a Spec zone to cue ingress or
      target area visually.
    support: supported
    meta:
      intent: [visual_cue, target_area, immersion]
      mission_types: [ground_attack, intercept, cap, escort, free_flight]
      actions: [mark, smoke]
      conditions: [time_more, coalition_in_zone, flag_is]
      recipe: >
        Define a zone; on time or zone entry emit mark (zone + text) and/or smoke
        (zone + curated color green|red|white|orange|blue).
      example: examples/manston_ground_attack_markers.yaml

  - family: mission_behaviour
    id: narrative_pack
    label: Opt-in narrative pack
    description: >
      Expand curated immersion (push / callouts / win) via narrative.enabled when
      zones and triggers are empty — never with hand-authored triggers.
    support: supported
    meta:
      intent: [immersion, win_condition, radio_colour]
      mission_types: [cap, intercept, ground_attack, escort]
      recipe: >
        Set narrative.enabled true (and leave zones/triggers empty). Packs expand into
        typed conditions/actions; do not invent Lua.
      examples:
        - examples/manston_cap_narrative.yaml
        - examples/manston_dawn_intercept_narrative.yaml
        - examples/manston_ground_attack_narrative.yaml
        - examples/manston_escort_narrative.yaml

  - family: mission_behaviour
    id: radio_late_activation
    label: F10 radio + late activation
    description: >
      Dormant enemies/targets (late_activation) spawned from an F10 radio menu item
      for player-chosen difficulty or timing.
    support: supported
    meta:
      intent: [difficulty_menu, player_choice, spawn]
      mission_types: [intercept, cap, escort, ground_attack]
      conditions: [flag_is]
      actions: [radio_item_add, radio_item_remove, activate_group, message]
      recipe: >
        enemies/targets late_activation true; on mission start radio_item_add; flag from
        menu → activate_group (enemy_index or target_index).
      example: examples/manston_dawn_intercept_radio.yaml

  - family: mission_behaviour
    id: sound_flag_chain
    label: Curated sound + numeric flags
    description: >
      Play a curated sound asset and/or drive timed flag beats (equals/more/less,
      time_since_flag, inc_flag, set_flag_value, set_flag_random) without file paths.
    support: supported
    meta:
      intent: [audio_cue, timed_beats, immersion, random_flag]
      mission_types: [free_flight, intercept, cap, ground_attack, escort]
      conditions: [time_more, flag_equals, flag_more, flag_less, time_since_flag]
      actions: [sound, set_flag, set_flag_value, inc_flag, set_flag_random, message]
      recipe: >
        sound uses curated asset_id only; chain flags with flag_equals/more/less and
        time_since_flag for sequenced callouts; set_flag_random for native raid dice
        (min–max inclusive) before branching on flag_equals.
      example: examples/manston_freeflight_sound_flags.yaml
      example_flag_random: examples/manston_freeflight_flag_random.yaml

  - family: mission_behaviour
    id: group_life_less
    label: Group life remaining threshold
    description: >
      Fire when an enemy or target group’s remaining life drops below a percent
      (partial-damage objective beat).
    support: supported
    meta:
      intent: [partial_damage, objective_beat]
      mission_types: [ground_attack, intercept, cap, escort]
      conditions: [group_life_less]
      actions: [message, set_flag, mission_end]
      recipe: >
        group_life_less with enemy_index or target_index plus percent 1–100 (remaining
        life), then message / flag / mission_end as needed.
      example: examples/manston_ground_attack_life_less.yaml

  # --- mission_inspiration: advisory patterns → behaviour ids ---
  - family: mission_inspiration
    id: low_level_channel_hop
    label: Low-level Channel hop
    description: >
      Free-flight familiarisation with a hard deck and speed limit after takeoff —
      stay low and measured over the coast.
    support: advisory
    meta:
      behaviours: [altitude_speed_gates]
      source: stock/R5-style free-flight discipline
      mission_types: [free_flight]

  - family: mission_inspiration
    id: marked_strike_ingress
    label: Marked strike ingress
    description: >
      Ground-attack with F10 mark + smoke on the target zone so the pilot can find the
      aim point visually, optionally with a life-% beat.
    support: advisory
    meta:
      behaviours: [mark_smoke, group_life_less]
      source: stock GA / ME marker patterns
      mission_types: [ground_attack]

  - family: mission_inspiration
    id: scramble_difficulty_menu
    label: Scramble with difficulty menu
    description: >
      Dawn intercept where the player chooses when bandits appear via F10 radio, with
      optional narrative immersion if not hand-writing triggers.
    support: advisory
    meta:
      behaviours: [radio_late_activation, narrative_pack]
      source: Dawn Raid–style radio + late activation (R5)
      mission_types: [intercept]

  - family: mission_inspiration
    id: cap_with_narrative_beats
    label: CAP with narrative beats
    description: >
      Patrol station with curated CAP narrative (on-station / bandits / win) when the
      user wants immersion without authoring triggers by hand.
    support: advisory
    meta:
      behaviours: [narrative_pack]
      source: curated narrative packs
      mission_types: [cap]

  - family: mission_inspiration
    id: timed_audio_callouts
    label: Timed audio callouts
    description: >
      Free flight or training hop with a curated beep and flag-driven message beats
      for procedural rhythm.
    support: advisory
    meta:
      behaviours: [sound_flag_chain]
      source: sound + flag enrichment sample
      mission_types: [free_flight, intercept]

  # --- Mission-designer shelves (palette for co-authoring; Spec dynamics = #30f) ---
  # Layer A = dcs-miz randomize (new Spec day). Layer B = dynamics_mode / Spec dynamics
  # (play-time variation inside one .miz).

  - family: dynamics_mode
    id: fixed
    label: Fixed sortie
    description: >
      Same play every load — no raid dice or F10 spawn menus. Hand triggers and
      late groups still allowed. Layer B off; use Layer A (randomize CLI) if you
      want a different authored day. Spec: dynamics.mode fixed (no auto emit).
    support: supported
    meta:
      layer: play_time
      spec_field: dynamics.mode
      intended_emit: none
      note: Spec dynamics.mode=fixed clears the pack with no dice/menu triggers.

  - family: dynamics_mode
    id: live
    label: Live dice
    description: >
      Play-time surprise: Spec dynamics.mode live expands to set_flag_random and
      flag branches that activate late pools (and optional messages).
    support: supported
    meta:
      layer: play_time
      spec_field: dynamics.mode
      intended_emit: [set_flag_random, activate_group, message]
      related_behaviours: [sound_flag_chain, radio_late_activation]
      example: examples/manston_dawn_intercept_dynamics_live.yaml

  - family: dynamics_mode
    id: choose
    label: Player chooses (F10)
    description: >
      On-the-fly player choice via Spec dynamics.mode choose — F10 radio + late
      pools (difficulty / when bandits appear). Not Mist mid-mission rewrites.
    support: supported
    meta:
      layer: play_time
      spec_field: dynamics.mode
      intended_emit: [radio_item_add, activate_group, message]
      related_behaviours: [radio_late_activation]
      example: examples/manston_dawn_intercept_radio.yaml

  - family: dynamics_mode
    id: hybrid
    label: Hybrid (dice + F10)
    description: >
      Spec dynamics.mode hybrid — F10 Auto (dice) plus per-pool menu labels.
      Prefer exclusive: true so both layers do not double-spawn.
    support: supported
    meta:
      layer: play_time
      spec_field: dynamics.mode
      intended_emit: [set_flag_random, radio_item_add, activate_group, message]
      related_behaviours: [radio_late_activation, sound_flag_chain]
      example: examples/manston_dawn_intercept_dynamics_hybrid.yaml
  - family: strike_target_class
    id: soft_vehicles
    label: Soft vehicles / trucks
    description: >
      Land soft targets (trucks, light cars) on Axis-held French/Belgian coast —
      not UK home ground, not water. Spitfire bomb payloads; prefer 2×250 + slipper
      for Channel crossing.
    support: supported
    meta:
      domain: land
      unit_ids: [Blitz_36-6700A, Kubelwagen_82, Bedford_MWD]
      payload_families: [spitfire_2x250_slipper, spitfire_2x250, spitfire_1x500]
      mission_types: [ground_attack]

  - family: strike_target_class
    id: aaa_guns
    label: AAA / AT guns
    description: >
      Land flak and Pak positions inland/coastal Axis territory. Same payload guidance
      as soft vehicles; expect denser AAA around Dunkirk–Calais belts.
    support: supported
    meta:
      domain: land
      unit_ids: [flak18, flak36, Pak40]
      payload_families: [spitfire_2x250_slipper, spitfire_2x250, spitfire_1x500]
      mission_types: [ground_attack]

  - family: strike_target_class
    id: sea_craft
    label: Boats / ships
    description: >
      Mid-Channel or coastal water targets — ships.yaml ids only; never place land
      vehicles at sea. Prefer bomb payloads; large ships may need 500 lb.
    support: supported
    meta:
      domain: sea
      ship_ids: [Schnellboot_type_S130, Uboat_VIIC, Dry-cargo ship-1]
      payload_families: [spitfire_1x500, spitfire_2x250_slipper, spitfire_2x250]
      mission_types: [ground_attack]

  - family: strike_target_class
    id: hard_infrastructure
    label: Hard / infrastructure (buildings, bridges, airfields)
    description: >
      Large fixed targets (buildings, bridges, airfield infrastructure). No verified
      Channel static unit ids in the registry yet — do not invent DCS ids; use zones /
      marks and advisory planning until units are packaged.
    support: future
    meta:
      domain: land
      unit_ids: []
      payload_families: [spitfire_1x500, spitfire_2x250_slipper]
      mission_types: [ground_attack]
      note: Future shelf — not compile-backed as unit targets today.

  - family: channel_place
    id: manston_home
    label: Manston (home field)
    description: >
      RAF Manston — default Channel Spitfire start for free flight, scramble, and
      Channel-crossing strikes.
    support: advisory
    meta:
      airfield: Manston
      role: home_base
      mission_types: [free_flight, intercept, cap, ground_attack, escort]

  - family: channel_place
    id: french_coast_strike_belt
    label: French coast strike belt
    description: >
      Axis-held French/Belgian coastal belt (Dunkirk–Calais area) for land GA targets —
      place soft/AAA inland of the coast, not on UK soil or mid-Channel water.
    support: advisory
    meta:
      domain: land
      geometry_hint: inland_near_dunkirk
      related_classes: [soft_vehicles, aaa_guns]
      mission_types: [ground_attack]

  - family: channel_place
    id: mid_channel_shipping
    label: Mid-Channel shipping lane
    description: >
      Over-water Channel corridor for E-boat / U-boat / cargo ship strikes — sea_craft
      class only; keep land vehicles off the water.
    support: advisory
    meta:
      domain: sea
      geometry_hint: mid_channel
      related_classes: [sea_craft]
      mission_types: [ground_attack]

  # --- Aircraft failures (ME Set Failure; curated Spitfire ids only) ---
  - family: aircraft_failure
    id: magneto_training
    label: Magneto failure (training)
    description: >
      Schedule ENG0_MAGNETO0 via Spec failures (TimeAfter + Set Failure). Example:
      examples/manston_freeflight_magneto_failure.yaml (T+120). SpitfireLFMkIX only.
    support: supported
    meta:
      aircraft: SpitfireLFMkIX
      failure_id: ENG0_MAGNETO0
      family: engine
      example: examples/manston_freeflight_magneto_failure.yaml
      mission_types: [free_flight, intercept, cap, ground_attack, escort]

  - family: aircraft_failure
    id: coolant_radiator_leak
    label: Coolant radiator major leak
    description: >
      Spec failures id ENG0_WATER_RADIATOR_0_MAJOR_LEAK — curated Channel Spitfire
      Set Failure string; do not invent ids.
    support: supported
    meta:
      aircraft: SpitfireLFMkIX
      failure_id: ENG0_WATER_RADIATOR_0_MAJOR_LEAK
      family: engine

  - family: aircraft_failure
    id: control_rod_damage
    label: Control rod major damage
    description: >
      Curated control failures: CTRL_AILERON_ROD_MAJOR_DAMAGE,
      CTRL_ELEVATOR_ROD_MAJOR_DAMAGE, CTRL_RUDDER_ROD_MAJOR_DAMAGE.
    support: supported
    meta:
      aircraft: SpitfireLFMkIX
      failure_ids:
        - CTRL_AILERON_ROD_MAJOR_DAMAGE
        - CTRL_ELEVATOR_ROD_MAJOR_DAMAGE
        - CTRL_RUDDER_ROD_MAJOR_DAMAGE
      family: controls

  - family: aircraft_failure
    id: fuel_or_hydraulic_pump
    label: Fuel or hydraulic pump failure
    description: >
      Spec failures ids FUEL_ENGINE0_FUEL_PUMP_FAILURE or HYDR_PUMP_FAILURE from the
      Channel aircraft_failures catalog.
    support: supported
    meta:
      aircraft: SpitfireLFMkIX
      failure_ids: [FUEL_ENGINE0_FUEL_PUMP_FAILURE, HYDR_PUMP_FAILURE]
      family: systems
