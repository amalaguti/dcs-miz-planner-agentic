# Curated Channel planning knobs for agent/CLI discovery.
# support: supported | advisory | future
# - supported: Spec/compiler-backed id
# - advisory: guides an existing Spec field (see meta)
# - future: roadmap only — do not emit as compile-backed
options:
  - family: mission_type
    id: free_flight
    label: Free flight
    description: Solo/player flight with no enemies or objectives.
    support: supported

  - family: mission_type
    id: intercept
    label: Intercept
    description: Player scramble against an enemy flight with intercept objective.
    support: supported

  - family: mission_type
    id: cap
    label: CAP / patrol
    description: Patrol a station with orbit pattern and engagement rules; optional opposition.
    support: supported

  - family: mission_type
    id: ground_attack
    label: Ground attack
    description: >
      Channel strike with enemy ground targets and a named Spitfire bomb payload
      (prefer slipper tank for Channel crossings; jettison before attack).
    support: supported

  - family: mission_type
    id: escort
    label: Escort
    description: >
      Escort a friendly air package along an airfield-relative Channel route with
      engagement rules; optional enemy bounce.
    support: supported

  - family: start_type
    id: cold_parking
    label: Cold parking
    description: Start from parking cold (DCS TakeOffParking).
    support: supported

  - family: weather
    id: sunny_clear
    label: Sunny clear
    description: Clear skies, excellent visibility.
    support: supported

  - family: weather
    id: dawn_clear
    label: Dawn clear
    description: >-
      Mostly clear with light haze; good visibility at first light (pair with
      time_of_day dawn ~06:00).
    support: supported

  - family: weather
    id: marginal_vfr
    label: Marginal VFR
    description: Broken to overcast cloud; visibility about 5–8 km (marginal VFR).
    support: supported

  - family: time_of_day
    id: dawn
    label: Dawn
    description: First light; suggest start_time around 06:00.
    support: advisory
    meta:
      start_time: "06:00"

  - family: time_of_day
    id: morning
    label: Morning
    description: Mid-morning training / free flight default band.
    support: advisory
    meta:
      start_time: "09:00"

  - family: time_of_day
    id: noon
    label: Noon
    description: Midday high sun.
    support: advisory
    meta:
      start_time: "12:00"

  - family: time_of_day
    id: dusk
    label: Dusk
    description: Evening light; suggest start_time around 18:00.
    support: advisory
    meta:
      start_time: "18:00"

  - family: time_of_day
    id: night
    label: Night
    description: Night ops; suggest start_time around 22:00.
    support: advisory
    meta:
      start_time: "22:00"

  - family: opposition_density
    id: light
    label: Light opposition
    description: Single enemy flight, small count for intercept.
    support: advisory
    meta:
      enemies_count: 1

  - family: opposition_density
    id: medium
    label: Medium opposition
    description: Typical intercept pair or small section.
    support: advisory
    meta:
      enemies_count: 2

  - family: opposition_density
    id: heavy
    label: Heavy opposition
    description: Larger enemy flight; still maps to enemies.count only.
    support: advisory
    meta:
      enemies_count: 4

  - family: payload_family
    id: spitfire_2x250_slipper
    label: Spitfire 2x250 + slipper
    description: Channel-crossing loadout — wing 250 lb bombs and 45 gal slipper tank.
    support: supported
    meta:
      payload: spitfire_2x250_slipper

  - family: payload_family
    id: spitfire_2x250
    label: Spitfire 2x250
    description: Wing 250 lb bombs only (no external tank; shorter radius).
    support: supported
    meta:
      payload: spitfire_2x250

  - family: payload_family
    id: spitfire_1x500
    label: Spitfire 1x500
    description: Centreline 500 lb bomb (no external tank; shorter radius).
    support: supported
    meta:
      payload: spitfire_1x500

  - family: roe_seed
    id: weapons_hold
    label: Weapons hold
    description: Hold fire; maps to CAP Spec cap.engagement.
    support: supported
    meta:
      engagement: weapons_hold

  - family: roe_seed
    id: weapons_free
    label: Weapons free
    description: Engage detected threats; maps to CAP Spec cap.engagement.
    support: supported
    meta:
      engagement: weapons_free

  - family: roe_seed
    id: open_fire
    label: Open fire
    description: Engage tasked targets; maps to CAP Spec cap.engagement.
    support: supported
    meta:
      engagement: open_fire

  - family: roe_seed
    id: return_fire
    label: Return fire
    description: Fire only when fired upon; maps to CAP Spec cap.engagement.
    support: supported
    meta:
      engagement: return_fire

  - family: randomization
    id: seeded_reroll
    label: Seeded reroll
    description: >
      Reroll weather, clock, geometry, and/or opposition on an existing Spec via
      dcs-miz randomize / randomize_mission tool (seed argument; not a Spec field).
    support: advisory

  # --- mission_behaviour: compile-backed Spec recipes (agent creativity) ---
  - family: mission_behaviour
    id: altitude_speed_gates
    label: Altitude / speed ingress gates
    description: >
      Continuous player discipline after a short time gate: warn or cue when above
      an AGL ceiling or faster than a speed limit (ingress / low-level challenge).
    support: supported
    meta:
      intent: [ingress_discipline, low_level, challenge]
      mission_types: [free_flight, intercept, cap, ground_attack, escort]
      conditions: [time_more, unit_altitude_higher, unit_altitude_lower, unit_speed_higher, unit_speed_lower]
      actions: [message]
      recipe: >
        After time_more (~30s), continuous rules with unit_altitude_higher (altitude_m,
        agl true) and/or unit_speed_higher (speed_kmh) → message. Player unit only.
      example: examples/manston_freeflight_altitude_speed_gates.yaml

  - family: mission_behaviour
    id: mark_smoke
    label: F10 mark + smoke marker
    description: >
      Place an F10 map mark and/or ME smoke marker on a Spec zone to cue ingress or
      target area visually.
    support: supported
    meta:
      intent: [visual_cue, target_area, immersion]
      mission_types: [ground_attack, intercept, cap, escort, free_flight]
      actions: [mark, smoke]
      conditions: [time_more, coalition_in_zone, flag_is]
      recipe: >
        Define a zone; on time or zone entry emit mark (zone + text) and/or smoke
        (zone + curated color green|red|white|orange|blue).
      example: examples/manston_ground_attack_markers.yaml

  - family: mission_behaviour
    id: narrative_pack
    label: Opt-in narrative pack
    description: >
      Expand curated immersion (push / callouts / win) via narrative.enabled when
      zones and triggers are empty — never with hand-authored triggers.
    support: supported
    meta:
      intent: [immersion, win_condition, radio_colour]
      mission_types: [cap, intercept, ground_attack, escort]
      recipe: >
        Set narrative.enabled true (and leave zones/triggers empty). Packs expand into
        typed conditions/actions; do not invent Lua.
      examples:
        - examples/manston_cap_narrative.yaml
        - examples/manston_dawn_intercept_narrative.yaml
        - examples/manston_ground_attack_narrative.yaml
        - examples/manston_escort_narrative.yaml

  - family: mission_behaviour
    id: radio_late_activation
    label: F10 radio + late activation
    description: >
      Dormant enemies/targets (late_activation) spawned from an F10 radio menu item
      for player-chosen difficulty or timing.
    support: supported
    meta:
      intent: [difficulty_menu, player_choice, spawn]
      mission_types: [intercept, cap, escort, ground_attack]
      conditions: [flag_is]
      actions: [radio_item_add, radio_item_remove, activate_group, message]
      recipe: >
        enemies/targets late_activation true; on mission start radio_item_add; flag from
        menu → activate_group (enemy_index or target_index).
      example: examples/manston_dawn_intercept_radio.yaml

  - family: mission_behaviour
    id: sound_flag_chain
    label: Curated sound + numeric flags
    description: >
      Play a curated sound asset and/or drive timed flag beats (equals/more/less,
      time_since_flag, inc_flag, set_flag_value) without file paths.
    support: supported
    meta:
      intent: [audio_cue, timed_beats, immersion]
      mission_types: [free_flight, intercept, cap, ground_attack, escort]
      conditions: [time_more, flag_equals, flag_more, flag_less, time_since_flag]
      actions: [sound, set_flag, set_flag_value, inc_flag, message]
      recipe: >
        sound uses curated asset_id only; chain flags with flag_equals/more/less and
        time_since_flag for sequenced callouts.
      example: examples/manston_freeflight_sound_flags.yaml

  - family: mission_behaviour
    id: group_life_less
    label: Group life remaining threshold
    description: >
      Fire when an enemy or target group’s remaining life drops below a percent
      (partial-damage objective beat).
    support: supported
    meta:
      intent: [partial_damage, objective_beat]
      mission_types: [ground_attack, intercept, cap, escort]
      conditions: [group_life_less]
      actions: [message, set_flag, mission_end]
      recipe: >
        group_life_less with enemy_index or target_index plus percent 1–100 (remaining
        life), then message / flag / mission_end as needed.
      example: examples/manston_ground_attack_life_less.yaml

  # --- mission_inspiration: advisory patterns → behaviour ids ---
  - family: mission_inspiration
    id: low_level_channel_hop
    label: Low-level Channel hop
    description: >
      Free-flight familiarisation with a hard deck and speed limit after takeoff —
      stay low and measured over the coast.
    support: advisory
    meta:
      behaviours: [altitude_speed_gates]
      source: stock/R5-style free-flight discipline
      mission_types: [free_flight]

  - family: mission_inspiration
    id: marked_strike_ingress
    label: Marked strike ingress
    description: >
      Ground-attack with F10 mark + smoke on the target zone so the pilot can find the
      aim point visually, optionally with a life-% beat.
    support: advisory
    meta:
      behaviours: [mark_smoke, group_life_less]
      source: stock GA / ME marker patterns
      mission_types: [ground_attack]

  - family: mission_inspiration
    id: scramble_difficulty_menu
    label: Scramble with difficulty menu
    description: >
      Dawn intercept where the player chooses when bandits appear via F10 radio, with
      optional narrative immersion if not hand-writing triggers.
    support: advisory
    meta:
      behaviours: [radio_late_activation, narrative_pack]
      source: Dawn Raid–style radio + late activation (R5)
      mission_types: [intercept]

  - family: mission_inspiration
    id: cap_with_narrative_beats
    label: CAP with narrative beats
    description: >
      Patrol station with curated CAP narrative (on-station / bandits / win) when the
      user wants immersion without authoring triggers by hand.
    support: advisory
    meta:
      behaviours: [narrative_pack]
      source: curated narrative packs
      mission_types: [cap]

  - family: mission_inspiration
    id: timed_audio_callouts
    label: Timed audio callouts
    description: >
      Free flight or training hop with a curated beep and flag-driven message beats
      for procedural rhythm.
    support: advisory
    meta:
      behaviours: [sound_flag_chain]
      source: sound + flag enrichment sample
      mission_types: [free_flight, intercept]
