# Curated Channel planning knobs for agent/CLI discovery.
# support: supported | advisory | future
# - supported: Spec/compiler-backed id
# - advisory: guides an existing Spec field (see meta)
# - future: roadmap only — do not emit as compile-backed
options:
  - family: mission_type
    id: free_flight
    label: Free flight
    description: Solo/player flight with no enemies or objectives.
    support: supported

  - family: mission_type
    id: intercept
    label: Intercept
    description: Player scramble against an enemy flight with intercept objective.
    support: supported

  - family: mission_type
    id: cap
    label: CAP / patrol
    description: Patrol a station with orbit pattern and engagement rules; optional opposition.
    support: supported

  - family: mission_type
    id: ground_attack
    label: Ground attack
    description: >
      Channel strike with enemy ground targets and a named Spitfire bomb payload
      (prefer slipper tank for Channel crossings; jettison before attack).
    support: supported

  - family: mission_type
    id: escort
    label: Escort
    description: >
      Escort a friendly air package along an airfield-relative Channel route with
      engagement rules; optional enemy bounce.
    support: supported

  - family: mission_type
    id: recon
    label: Recon / locate
    description: >
      Locate or observe an airfield-relative AOI (optional visual contacts) without
      strike payload; find message then RTB.
    support: supported

  - family: start_type
    id: cold_parking
    label: Cold parking
    description: Start from parking cold (DCS TakeOffParking).
    support: supported

  - family: player_flight_size
    id: solo
    label: Solo
    description: Single Skill=Player aircraft (omit player.flight).
    support: supported
    meta:
      omit_flight: true

  - family: player_flight_size
    id: pair
    label: Pair (2)
    description: Two-ship player section via player.flight.size 2.
    support: supported
    meta:
      size: 2

  - family: player_flight_size
    id: three_ship
    label: Three-ship
    description: Three-ship player section via player.flight.size 3.
    support: supported
    meta:
      size: 3

  - family: player_flight_size
    id: four_ship
    label: Four-ship
    description: Four-ship player section via player.flight.size 4 (prefer Manston parking).
    support: supported
    meta:
      size: 4

  - family: player_flight_role
    id: lead
    label: Flight lead
    description: Human is Skill=Player on the first unit; AI wingmen fill the rest.
    support: supported
    meta:
      role: lead

  - family: player_flight_role
    id: wingman
    label: Wingman
    description: >
      Human flies a size-1 Player group beside a separate AI lead group (size−1).
      DCS single-player cannot put Player on unit 2 of a mixed group. With join_up
      (default true) the lead flies the route and you Follow after climb.
    support: supported
    meta:
      role: wingman

  - family: player_flight_join_up
    id: join_up
    label: Join up / Follow lead
    description: >
      Wingman only: AI lead flies the section route; player Follows after takeoff.
      Lead role ignores this (same-group mates already stick). Set join_up false to
      disable Follow/shared route.
    support: supported
    meta:
      join_up: true

  - family: player_flight_join_up
    id: independent
    label: Independent (no Follow)
    description: Wingman groups without Follow — player and AI lead fly separately.
    support: supported
    meta:
      join_up: false

  - family: player_flight_order
    id: rejoin
    label: Section rejoin / form up
    description: >
      F10 "Section: Rejoin" — wingman re-Follows AI lead; lead same-group is advisory
      (native formation). Spec: player.flight.orders include rejoin.
    support: supported
    meta:
      order_id: rejoin
      example: examples/manston_cap_flight_orders.yaml

  - family: player_flight_order
    id: engage
    label: Section engage
    description: >
      F10 "Section: Engage" — AI section ROE weapons free.
    support: supported
    meta:
      order_id: engage

  - family: player_flight_order
    id: orbit
    label: Section orbit
    description: >
      F10 "Section: Orbit" — AI section holds a circle orbit.
    support: supported
    meta:
      order_id: orbit

  - family: player_flight_order
    id: rtb
    label: Section RTB
    description: >
      F10 "Section: RTB" — AI section lands at home airfield.
    support: supported
    meta:
      order_id: rtb

  - family: player_flight_order
    id: break
    label: Section break
    description: >
      F10 "Section: Break" — stop AI section tasking / leave formation push.
    support: supported
    meta:
      order_id: break

  - family: player_flight_discipline
    id: defaults
    label: Section discipline (defaults)
    description: >
      Opt-in fail-to-follow for wingman+join_up. Empty discipline:{} uses radius
      2500 m, soft warn at 45 s outside, hard message_end at 120 s. Spec:
      player.flight.discipline: {}. Example: manston_cap_flight_discipline.yaml.
    support: supported
    meta:
      example: examples/manston_cap_flight_discipline.yaml

  - family: player_flight_discipline
    id: message_end
    label: Discipline hard = message only
    description: >
      Soft rejoin warn then a final message (no mission_end). Spec:
      player.flight.discipline.hard: message_end
    support: supported
    meta:
      hard: message_end

  - family: player_flight_discipline
    id: mission_end
    label: Discipline hard = mission end
    description: >
      Soft warn then EndMission if still outside the section bubble. Spec:
      player.flight.discipline.hard: mission_end
    support: supported
    meta:
      hard: mission_end

  - family: player_flight_discipline
    id: section_rtb
    label: Discipline hard = section RTB
    description: >
      Soft warn then push AI lead Land/RTB. Spec:
      player.flight.discipline.hard: section_rtb
    support: supported
    meta:
      hard: section_rtb

  - family: weather
    id: sunny_clear
    label: Sunny clear
    description: Clear skies, excellent visibility.
    support: supported

  - family: weather
    id: dawn_clear
    label: Dawn clear
    description: >-
      Mostly clear with light haze; good visibility at first light (pair with
      time_of_day dawn ~06:00).
    support: supported

  - family: weather
    id: sea_fog
    label: Sea fog
    description: Dense Channel sea fog; visibility about 1 km near the surface.
    support: supported

  - family: weather
    id: marginal_vfr
    label: Marginal VFR
    description: Broken to overcast cloud; visibility about 5–8 km (marginal VFR).
    support: supported

  - family: weather
    id: light_scattered_vfr
    label: Light scattered VFR
    description: Light scattered cloud; good Channel VFR (campaign clear-day feel).
    support: supported
    meta:
      cloud_preset: Preset1

  - family: weather
    id: high_scattered
    label: High scattered
    description: High scattered layer; cooler Channel day with good tops visibility.
    support: supported
    meta:
      cloud_preset: Preset3

  - family: weather
    id: broken_channel
    label: Broken Channel
    description: Broken cloud deck typical of Channel patrol / scramble days.
    support: supported
    meta:
      cloud_preset: Preset14

  - family: weather
    id: overcast_low
    label: Low overcast
    description: Low overcast; grey Channel day, still flyable under the deck.
    support: supported
    meta:
      cloud_preset: Preset22

  - family: weather
    id: rain_overcast
    label: Rain overcast
    description: Overcast with rain; poor VFR, diversion weather.
    support: supported
    meta:
      cloud_preset: RainyPreset1

  - family: weather
    id: showers_scattered
    label: Showers scattered
    description: >-
      Scattered to broken cloud with light rain or showers; flyable Channel day.
    support: supported
    meta:
      cloud_preset: RainyPreset4

  - family: weather
    id: scattered_summer
    label: Scattered summer
    description: Summer scattered cloud; warmer day, fair visibility.
    support: supported
    meta:
      cloud_preset: Preset9

  - family: time_of_day
    id: dawn
    label: Dawn
    description: First light; suggest start_time around 06:00.
    support: advisory
    meta:
      start_time: "06:00"

  - family: time_of_day
    id: morning
    label: Morning
    description: Mid-morning training / free flight default band.
    support: advisory
    meta:
      start_time: "09:00"

  - family: time_of_day
    id: noon
    label: Noon
    description: Midday high sun.
    support: advisory
    meta:
      start_time: "12:00"

  - family: time_of_day
    id: dusk
    label: Dusk
    description: Evening light; suggest start_time around 18:00.
    support: advisory
    meta:
      start_time: "18:00"

  - family: time_of_day
    id: night
    label: Night
    description: Night ops; suggest start_time around 22:00.
    support: advisory
    meta:
      start_time: "22:00"

  - family: opposition_density
    id: light
    label: Light opposition
    description: Single enemy flight, small count for intercept.
    support: advisory
    meta:
      enemies_count: 1

  - family: opposition_density
    id: medium
    label: Medium opposition
    description: Typical intercept pair or small section.
    support: advisory
    meta:
      enemies_count: 2

  - family: opposition_density
    id: heavy
    label: Heavy opposition
    description: Larger enemy flight; still maps to enemies.count only.
    support: advisory
    meta:
      enemies_count: 4

  - family: payload_family
    id: spitfire_2x250_slipper
    label: Spitfire 2x250 + slipper
    description: Channel-crossing loadout — wing 250 lb bombs and 45 gal slipper tank.
    support: supported
    meta:
      payload: spitfire_2x250_slipper

  - family: payload_family
    id: spitfire_2x250
    label: Spitfire 2x250
    description: Wing 250 lb bombs only (no external tank; shorter radius).
    support: supported
    meta:
      payload: spitfire_2x250

  - family: payload_family
    id: spitfire_1x500
    label: Spitfire 1x500
    description: Centreline 500 lb bomb (no external tank; shorter radius).
    support: supported
    meta:
      payload: spitfire_1x500

  - family: roe_seed
    id: weapons_hold
    label: Weapons hold
    description: Hold fire; maps to CAP Spec cap.engagement.
    support: supported
    meta:
      engagement: weapons_hold

  - family: roe_seed
    id: weapons_free
    label: Weapons free
    description: Engage detected threats; maps to CAP Spec cap.engagement.
    support: supported
    meta:
      engagement: weapons_free

  - family: roe_seed
    id: open_fire
    label: Open fire
    description: Engage tasked targets; maps to CAP Spec cap.engagement.
    support: supported
    meta:
      engagement: open_fire

  - family: roe_seed
    id: return_fire
    label: Return fire
    description: Fire only when fired upon; maps to CAP Spec cap.engagement.
    support: supported
    meta:
      engagement: return_fire

  - family: randomization
    id: seeded_reroll
    label: Seeded reroll
    description: >
      Reroll weather, clock, geometry, and/or opposition on an existing Spec via
      dcs-miz randomize / randomize_mission tool (seed argument; not a Spec field).
    support: advisory

  # --- mission_behaviour: compile-backed Spec recipes (agent creativity) ---
  - family: mission_behaviour
    id: altitude_speed_gates
    label: Altitude / speed ingress gates
    description: >
      Player discipline after a short time gate: warn when above an AGL ceiling or
      faster than a speed limit, then re-warn on a cooldown while still violating
      (flag + time_since_flag) — not every ME tick.
    support: supported
    meta:
      intent: [ingress_discipline, low_level, challenge]
      mission_types: [free_flight, intercept, cap, ground_attack, escort]
      conditions:
        [
          time_more,
          unit_altitude_higher,
          unit_altitude_lower,
          unit_speed_higher,
          unit_speed_lower,
          flag_is,
          time_since_flag,
        ]
      actions: [message, set_flag]
      recipe: >
        After time_more (~30s): first warn when unit_altitude_higher / unit_speed_higher
        and cooldown flag is false → message + set_flag true; re-warn when still out of
        limits and time_since_flag (~45s) → message + set_flag true; clear flag with
        unit_altitude_lower / unit_speed_lower. altitude_m/speed_kmh emit as integers.
      example: examples/manston_freeflight_altitude_speed_gates.yaml

  - family: mission_behaviour
    id: mark_smoke
    label: F10 mark + smoke marker
    description: >
      Place an F10 map mark and/or ME smoke marker on a Spec zone to cue ingress or
      target area visually.
    support: supported
    meta:
      intent: [visual_cue, target_area, immersion]
      mission_types: [ground_attack, intercept, cap, escort, free_flight]
      actions: [mark, smoke]
      conditions: [time_more, coalition_in_zone, flag_is]
      recipe: >
        Define a zone; on time or zone entry emit mark (zone + text) and/or smoke
        (zone + curated color green|red|white|orange|blue).
      example: examples/manston_ground_attack_markers.yaml

  - family: mission_behaviour
    id: narrative_pack
    label: Opt-in narrative pack
    description: >
      Expand curated immersion (push / callouts / win) via narrative.enabled when
      zones and triggers are empty — never with hand-authored triggers.
    support: supported
    meta:
      intent: [immersion, win_condition, radio_colour]
      mission_types: [cap, intercept, ground_attack, escort]
      recipe: >
        Set narrative.enabled true (and leave zones/triggers empty). Packs expand into
        typed conditions/actions; do not invent Lua.
      examples:
        - examples/manston_cap_narrative.yaml
        - examples/manston_dawn_intercept_narrative.yaml
        - examples/manston_ground_attack_narrative.yaml
        - examples/manston_escort_narrative.yaml

  - family: mission_behaviour
    id: radio_late_activation
    label: F10 radio + late activation
    description: >
      Dormant enemies/targets (late_activation) spawned from an F10 radio menu item
      for player-chosen difficulty or timing.
    support: supported
    meta:
      intent: [difficulty_menu, player_choice, spawn]
      mission_types: [intercept, cap, escort, ground_attack]
      conditions: [flag_is]
      actions: [radio_item_add, radio_item_remove, activate_group, message]
      recipe: >
        enemies/targets late_activation true; on mission start radio_item_add; flag from
        menu → activate_group (enemy_index or target_index).
      example: examples/manston_dawn_intercept_radio.yaml

  - family: mission_behaviour
    id: sound_flag_chain
    label: Curated sound + numeric flags
    description: >
      Play a curated sound asset and/or drive timed flag beats (equals/more/less,
      time_since_flag, inc_flag, set_flag_value, set_flag_random) without file paths.
    support: supported
    meta:
      intent: [audio_cue, timed_beats, immersion, random_flag]
      mission_types: [free_flight, intercept, cap, ground_attack, escort]
      conditions: [time_more, flag_equals, flag_more, flag_less, time_since_flag]
      actions: [sound, set_flag, set_flag_value, inc_flag, set_flag_random, message]
      recipe: >
        sound uses curated asset_id only; chain flags with flag_equals/more/less and
        time_since_flag for sequenced callouts; set_flag_random for native raid dice
        (min–max inclusive) before branching on flag_equals.
      example: examples/manston_freeflight_sound_flags.yaml
      example_flag_random: examples/manston_freeflight_flag_random.yaml

  - family: mission_behaviour
    id: group_life_less
    label: Group life remaining threshold
    description: >
      Fire when an enemy or target group’s remaining life drops below a percent
      (partial-damage objective beat).
    support: supported
    meta:
      intent: [partial_damage, objective_beat]
      mission_types: [ground_attack, intercept, cap, escort]
      conditions: [group_life_less]
      actions: [message, set_flag, mission_end]
      recipe: >
        group_life_less with enemy_index or target_index plus percent 1–100 (remaining
        life), then message / flag / mission_end as needed.
      example: examples/manston_ground_attack_life_less.yaml

  # --- mission_inspiration: advisory patterns → behaviour ids ---
  - family: mission_inspiration
    id: low_level_channel_hop
    label: Low-level Channel hop
    description: >
      Free-flight familiarisation with a hard deck and speed limit after takeoff —
      stay low and measured over the coast.
    support: advisory
    meta:
      behaviours: [altitude_speed_gates]
      source: stock/R5-style free-flight discipline
      mission_types: [free_flight]

  - family: mission_inspiration
    id: marked_strike_ingress
    label: Marked strike ingress
    description: >
      Ground-attack with F10 mark + smoke on the target zone so the pilot can find the
      aim point visually, optionally with a life-% beat.
    support: advisory
    meta:
      behaviours: [mark_smoke, group_life_less]
      source: stock GA / ME marker patterns
      mission_types: [ground_attack]

  - family: mission_inspiration
    id: scramble_difficulty_menu
    label: Scramble with difficulty menu
    description: >
      Dawn intercept where the player chooses when bandits appear via F10 radio, with
      optional narrative immersion if not hand-writing triggers.
    support: advisory
    meta:
      behaviours: [radio_late_activation, narrative_pack]
      source: Dawn Raid–style radio + late activation (R5)
      mission_types: [intercept]

  - family: mission_inspiration
    id: cap_with_narrative_beats
    label: CAP with narrative beats
    description: >
      Patrol station with curated CAP narrative (on-station / bandits / win) when the
      user wants immersion without authoring triggers by hand.
    support: advisory
    meta:
      behaviours: [narrative_pack]
      source: curated narrative packs
      mission_types: [cap]

  - family: mission_inspiration
    id: timed_audio_callouts
    label: Timed audio callouts
    description: >
      Free flight or training hop with a curated beep and flag-driven message beats
      for procedural rhythm.
    support: advisory
    meta:
      behaviours: [sound_flag_chain]

  - family: mission_inspiration
    id: uboat_surfaced_hunt
    label: Surfaced U-boat locate / hunt
    description: >
      Mid-Channel surfaced Type VII C: recon (observe, weapons hold) and/or ground_attack
      (bomb while surfaced). Not true ASW — no depth charges or submerged detect. Prefer
      sea_craft Uboat_VIIC on mid_channel_shipping geometry with motion: patrol (under way).
      See manston_uboat_recon / manston_uboat_hunt examples.
    support: advisory
    meta:
      behaviours: []
      related_classes: [sea_craft]
      related_places: [mid_channel_shipping]
      mission_types: [recon, ground_attack]
      unit_ids: [Uboat_VIIC]
      note: surfaced_only
      preferred_motion: patrol

  # --- Mission-designer shelves (palette for co-authoring; Spec dynamics = #30f) ---
  # Layer A = dcs-miz randomize (new Spec day). Layer B = dynamics_mode / Spec dynamics
  # (play-time variation inside one .miz).

  - family: dynamics_mode
    id: fixed
    label: Fixed sortie
    description: >
      Same play every load — no raid dice or F10 spawn menus. Hand triggers and
      late groups still allowed. Layer B off; use Layer A (randomize CLI) if you
      want a different authored day. Spec: dynamics.mode fixed (no auto emit).
    support: supported
    meta:
      layer: play_time
      spec_field: dynamics.mode
      intended_emit: none
      note: Spec dynamics.mode=fixed clears the pack with no dice/menu triggers.

  - family: dynamics_mode
    id: live
    label: Live dice
    description: >
      Play-time surprise: Spec dynamics.mode live expands to set_flag_random and
      flag branches that activate late pools (and optional messages).
    support: supported
    meta:
      layer: play_time
      spec_field: dynamics.mode
      intended_emit: [set_flag_random, activate_group, message]
      related_behaviours: [sound_flag_chain, radio_late_activation]
      example: examples/manston_dawn_intercept_dynamics_live.yaml

  - family: dynamics_mode
    id: choose
    label: Player chooses (F10)
    description: >
      On-the-fly player choice via Spec dynamics.mode choose — F10 radio + late
      pools (difficulty / when bandits appear). Not Mist mid-mission rewrites.
    support: supported
    meta:
      layer: play_time
      spec_field: dynamics.mode
      intended_emit: [radio_item_add, activate_group, message]
      related_behaviours: [radio_late_activation]
      example: examples/manston_dawn_intercept_radio.yaml

  - family: dynamics_mode
    id: hybrid
    label: Hybrid (dice + F10)
    description: >
      Spec dynamics.mode hybrid — F10 Auto (dice) plus per-pool menu labels.
      Prefer exclusive: true so both layers do not double-spawn.
    support: supported
    meta:
      layer: play_time
      spec_field: dynamics.mode
      intended_emit: [set_flag_random, radio_item_add, activate_group, message]
      related_behaviours: [radio_late_activation, sound_flag_chain]
      example: examples/manston_dawn_intercept_dynamics_hybrid.yaml
  - family: strike_target_class
    id: soft_vehicles
    label: Soft vehicles / trucks
    description: >
      Land soft targets (trucks, light cars) on Axis-held French/Belgian coast —
      not UK home ground, not water. Prefer motion path or patrol (convoy); AAA stays
      static. Spitfire bomb payloads; prefer 2×250 + slipper for Channel crossing.
      Example: manston_ground_attack_convoy.
    support: supported
    meta:
      domain: land
      unit_ids: [Blitz_36-6700A, Sd_Kfz_2, Horch_901_typ_40_kfz_21, Kubelwagen_82, Bedford_MWD, Willys_MB]
      payload_families: [spitfire_2x250_slipper, spitfire_2x250, spitfire_1x500]
      mission_types: [ground_attack]
      preferred_motion: path
      preferred_ai_preset: convoy_transit
      cues: [truck, convoy, column, soft, blitz, kettenkrad, horch, jeep, willys]

  - family: strike_target_class
    id: halftracks_apc
    label: Halftracks / APC
    description: >
      Land halftracks and light APC on Axis-held French/Belgian coast — not UK home
      ground, not water. Prefer motion path or patrol; reuse convoy_transit AI (soft
      class). Spitfire bomb payloads; prefer 2×250 + slipper for Channel crossing.
      Example: manston_ground_attack_halftracks.
    support: supported
    meta:
      domain: land
      unit_ids: [Sd_Kfz_251, Sd_Kfz_7, M2A1_halftrack]
      payload_families: [spitfire_2x250_slipper, spitfire_2x250, spitfire_1x500]
      mission_types: [ground_attack]
      preferred_motion: path
      preferred_ai_preset: convoy_transit
      cues: [halftrack, half-track, spw, apc, 251, sdkfz 7, m2a1]

  - family: strike_target_class
    id: armor
    label: Armor / AFVs
    description: >
      Land tanks and assault guns on Axis-held French/Belgian coast — not UK home
      ground, not water. Prefer motion path or patrol; dug-in may use static.
      Reuse convoy_transit AI (soft class). Prefer 2×250 + slipper or 1×500 for
      harder AFVs. Example: manston_ground_attack_armor.
    support: supported
    meta:
      domain: land
      unit_ids: [Pz_IV_H, Stug_III, Cromwell_IV, M4_Sherman]
      payload_families: [spitfire_2x250_slipper, spitfire_1x500, spitfire_2x250]
      mission_types: [ground_attack]
      preferred_motion: path
      preferred_ai_preset: convoy_transit
      cues: [tank, armor, armour, panzer, stug, stug iii, sherman, cromwell, afv]

  - family: strike_target_class
    id: troops
    label: Troops / infantry
    description: >
      Land infantry on Axis-held French/Belgian coast — not UK home ground, not
      water. Prefer motion path or patrol (slow); dug-in may use static. Reuse
      convoy_transit AI (soft class). Spitfire bomb payloads for area targets.
      Example: manston_ground_attack_troops.
    support: supported
    meta:
      domain: land
      unit_ids: [soldier_mauser98, soldier_wwii_br_01, soldier_wwii_us]
      payload_families: [spitfire_2x250_slipper, spitfire_2x250, spitfire_1x500]
      mission_types: [ground_attack]
      preferred_motion: path
      preferred_ai_preset: convoy_transit
      cues: [infantry, troops, soldiers, patrol, mauser, foot]

  - family: strike_target_class
    id: aaa_guns
    label: AAA / AT guns
    description: >
      Land flak and Pak positions inland/coastal Axis territory. Prefer static (emplaced).
      Same payload guidance as soft vehicles; expect denser AAA around Dunkirk–Calais belts.
    support: supported
    meta:
      domain: land
      unit_ids:
        [
          flak18,
          flak30,
          flak36,
          flak37,
          flak38,
          Flakscheinwerfer_37,
          KDO_Mod40,
          Pak40,
          bofors40,
        ]
      payload_families: [spitfire_2x250_slipper, spitfire_2x250, spitfire_1x500]
      mission_types: [ground_attack]
      preferred_motion: static
      preferred_ai_preset: aaa_alert
      cues: [flak, aaa, guns, pak, battery, searchlight, bofors, kdo]

  - family: ground_ai_preset
    id: convoy_transit
    label: Convoy transit (soft)
    description: >
      Soft land targets — Alarm Green, Return Fire, Off Road move_formation.
      Pair with motion path/patrol. Example: manston_ground_attack_convoy.
    support: supported
    meta:
      domain: land
      class: soft
      preferred_motion: path
      example: examples/manston_ground_attack_convoy.yaml

  - family: ground_ai_preset
    id: aaa_alert
    label: AAA alert
    description: >
      Emplaced AAA — Alarm Red, Open Fire, engage air weapons, interception range.
      Prefer static. Example: manston_ground_attack_flak_alert.
    support: supported
    meta:
      domain: land
      class: aaa
      preferred_motion: static
      example: examples/manston_ground_attack_flak_alert.yaml

  - family: ground_ai_preset
    id: ship_under_way
    label: Ship under way
    description: >
      Sea craft — Return Fire + Alarm Green (no disperse / move_formation).
      Pair with motion patrol/path. Example: manston_uboat_hunt.
    support: supported
    meta:
      domain: sea
      preferred_motion: patrol
      example: examples/manston_uboat_hunt.yaml

  - family: ground_ai_preset
    id: harbour_static
    label: Harbour / dock static
    description: >
      Tied-up sea or quiet static posture — Weapons Hold + Alarm Auto.
    support: supported
    meta:
      domain: sea
      preferred_motion: static
      cues: [harbour, harbor, dock, tied up, alongside]

  - family: target_move_formation
    id: off_road
    label: Off Road
    description: Land waypoint PointAction Off Road (default convoy).
    support: supported
    meta:
      domain: land

  - family: target_move_formation
    id: on_road
    label: On Road
    description: Land waypoint PointAction On Road (use near road mesh).
    support: supported
    meta:
      domain: land

  - family: strike_target_class
    id: sea_craft
    label: Boats / ships
    description: >
      Mid-Channel or coastal water targets — ships.yaml ids only; never place land
      vehicles at sea. Open water: prefer motion patrol/path; harbour/dock: static.
      Prefer bomb payloads; large ships may need 500 lb.
    support: supported
    meta:
      domain: sea
      ship_ids:
        [
          Schnellboot_type_S130,
          Uboat_VIIC,
          Dry-cargo ship-1,
          Dry-cargo ship-2,
          HarborTug,
          Higgins_boat,
        ]
      payload_families: [spitfire_1x500, spitfire_2x250_slipper, spitfire_2x250]
      mission_types: [ground_attack]
      preferred_motion: patrol
      preferred_ai_preset: ship_under_way
      cues: [uboat, e-boat, shipping, under way, mid-channel, tug, harbour, higgins]
      harbour_ai_preset: harbour_static
      harbour_motion: static

  - family: strike_target_class
    id: hard_infrastructure
    label: Hard / infrastructure (buildings, bridges, airfields)
    description: >
      Large fixed targets (buildings, bridges, airfield infrastructure). No verified
      Channel static unit ids in the registry yet — do not invent DCS ids; use zones /
      marks and advisory planning until units are packaged.
    support: future
    meta:
      domain: land
      unit_ids: []
      payload_families: [spitfire_1x500, spitfire_2x250_slipper]
      mission_types: [ground_attack]
      note: Future shelf — not compile-backed as unit targets today.

  - family: channel_place
    id: manston_home
    label: Manston (home field)
    description: >
      RAF Manston — default Channel Spitfire start for free flight, scramble, and
      Channel-crossing strikes.
    support: advisory
    meta:
      airfield: Manston
      role: home_base
      mission_types: [free_flight, intercept, cap, ground_attack, escort]

  - family: channel_place
    id: french_coast_strike_belt
    label: French coast strike belt
    description: >
      Axis-held French/Belgian coastal belt (Dunkirk–Calais area) for land GA targets —
      place soft/AAA inland of the coast, not on UK soil or mid-Channel water.
      Copy strike_bearing_deg / strike_distance_km for Spec strike. For soft path
      invent, prefer 2–3 points from path_point_deltas (strike + each delta) — do not
      invent long free routes or mid-Channel path distances.
    support: advisory
    meta:
      domain: land
      geometry_hint: inland_near_dunkirk
      related_classes: [soft_vehicles, halftracks_apc, armor, troops, aaa_guns]
      mission_types: [ground_attack]
      cues: [dunkirk, calais, french coast, inland, convoy, halftrack, tank, troops, flak]
      preferred_ai_preset_soft: convoy_transit
      preferred_ai_preset_aaa: aaa_alert
      # From examples/manston_ground_attack.yaml / convoy / flak_alert
      strike_bearing_deg: 125
      strike_distance_km: 76
      strike_altitude_m: 2000
      example: examples/manston_ground_attack.yaml
      path_point_deltas:
        - {bearing_delta_deg: 0, distance_delta_km: 0}
        - {bearing_delta_deg: 3, distance_delta_km: 1}
        - {bearing_delta_deg: -3, distance_delta_km: 2}
      note: >
        Land only. Invent path = strike + path_point_deltas (prefer 2–3 points).
        Do not invent path points at mid-Channel distances.

  - family: channel_place
    id: mid_channel_shipping
    label: Mid-Channel shipping lane
    description: >
      Over-water Channel corridor for E-boat / U-boat / cargo ship strikes — sea_craft
      class only; keep land vehicles off the water. Prefer under-way motion (patrol).
      Also fits recon contacts (observe). Copy strike/AOI bearing+distance from meta.
    support: advisory
    meta:
      domain: sea
      geometry_hint: mid_channel
      related_classes: [sea_craft]
      mission_types: [ground_attack, recon]
      preferred_motion: patrol
      preferred_ai_preset: ship_under_way
      cues: [mid-channel, shipping, uboat, e-boat, under way]
      harbour_ai_preset: harbour_static
      harbour_motion: static
      # From examples/manston_uboat_hunt.yaml / manston_uboat_recon.yaml
      strike_bearing_deg: 140
      strike_distance_km: 40
      strike_altitude_m: 2000
      aoi_bearing_deg: 140
      aoi_distance_km: 40
      aoi_altitude_m: 2000
      example: examples/manston_uboat_hunt.yaml
      note: >
        Water only. Do not use french_coast inland distances for sea craft.

  - family: channel_place
    id: coastal_harbour
    label: Coastal harbour / dock
    description: >
      Near-coast harbour or dock shipping (tied up) — sea_craft / sea-domain units
      only (call list_strike_targets with domain=sea). Never soft land trucks
      (Blitz/Bedford). Not mid-Channel under way and not UK home waters.
      Use harbour_static + static motion. Copy strike geometry from meta.
    support: advisory
    meta:
      domain: sea
      geometry_hint: coastal_harbour
      related_classes: [sea_craft]
      mission_types: [ground_attack, recon]
      preferred_motion: static
      preferred_ai_preset: harbour_static
      cues: [harbour, harbor, dock, tied up, alongside, port]
      sea_units_only: true
      # Near Dunkirk approach water (coast): 120/70 is land; 120/68 is coastal sea.
      strike_bearing_deg: 120
      strike_distance_km: 68
      strike_altitude_m: 2000
      example: examples/manston_uboat_hunt.yaml
      note: >
        Sea/coastal water + sea_craft only. Never land soft vehicles; never place
        harbour strikes a few km from Manston. Use ~120°/68 km (70 km is often land).

