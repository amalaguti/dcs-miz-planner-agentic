  - family: payload_family
    id: spitfire_2x250_slipper
    label: Spitfire 2x250 + slipper
    description: Channel-crossing loadout — wing 250 lb bombs and 45 gal slipper tank.
    support: supported
    meta:
      payload: spitfire_2x250_slipper

  - family: payload_family
    id: spitfire_2x250
    label: Spitfire 2x250
    description: Wing 250 lb bombs only (no external tank; shorter radius).
    support: supported
    meta:
      payload: spitfire_2x250

  - family: payload_family
    id: spitfire_1x500
    label: Spitfire 1x500
