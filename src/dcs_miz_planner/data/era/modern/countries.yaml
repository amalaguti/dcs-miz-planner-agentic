# Exact PyDCS country class names for modern Specs. Do not invent ids.
# Germany is a hint to ThirdReich (modern blue in PyDCS), not a known country.
# Russia is a Caucasus north-of-ridge host (PyDCS defaults Russia to red).
# Syria (country) is a Syria-map inland host (PyDCS defaults Syria to red).
# Theatre id Syria ≠ country Syria.
# Argentina is a Falklands extra-AF host (PyDCS countries.Argentina id 83; red).
# Norway is a Kola Stage A host (PyDCS countries.Norway id 12; blue at Bodo).
# Chile is deferred.
countries:
  Georgia: {}
  Turkey: {}
  USA: {}
  UK: {}
  Russia: {}
  Syria: {}
  Argentina: {}
  Norway: {}
