# Exact DCS type ids and default group radio (MHz). Do not invent spellings.
# 251.0 is the PyDCS/DCS modern UHF default — not Spitfire VHF 124, not Batumi ATC.
# Spitfire is dual-era (same 124.0 ref as WWII) — DCS flies it on modern maps.
aircraft:
  Su-25T:
    radio_mhz: 251.0
  SpitfireLFMkIX:
    radio_mhz: 124.0
    radio_channels_mhz: [124.0, 40.0, 41.0, 42.0, 108.9]
  SpitfireLFMkIXCW:
    radio_mhz: 124.0
    radio_channels_mhz: [124.0, 40.0, 41.0, 42.0, 108.9]
